<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>My Budget Tracker</h1>
        <p class="subtitle">Track your income and expenses in one place.</p>

        <section id="add-expense" class="expense-section">
            <h2>Add Expense</h2>

            <div class="input-group">
                <label for="expense-name">Expense Name</label>
                <input type="text" id="expense-name" placeholder="Enter expense name">
            </div>

            <div class="input-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="Enter amount">
            </div>

            <div class="input-group">
                <label for="category">Category</label>
                <input type="text" id="category" placeholder="Enter category">
            </div>
        </section>

        <section id="your-expenses" class="expenses-section">
            <h2>Your Expenses</h2>
            <p class="placeholder">No expenses yet.</p>
        </section>
    </main>

</body>
</html>
